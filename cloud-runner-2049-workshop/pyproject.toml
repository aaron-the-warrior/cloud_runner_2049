[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-runner-2049-workshop"
version = "0.1.0"
description = "Taller multi-agente con Google Agent Development Kit (ADK), Remote MCP, A2A y LLM-as-a-Judge basado en Race Condition (Google Cloud Next)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google Developer Experts (GDE)", email = "community@google.com" }
]
keywords = ["adk", "google-cloud", "gemini", "mcp", "a2a", "multi-agent", "race-condition"]
dependencies = [
    "google-adk>=2.12.0",
    "google-genai>=2.31.0",
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "geojson>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
